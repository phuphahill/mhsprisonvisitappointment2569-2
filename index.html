<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบจองเยี่ยมญาติใกล้ชิด</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: "Sarabun", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      width: 95%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    p {
      font-size: 15px;
      opacity: 0.85;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 500;
      background-color: #1e3a8a;
      color: #ffffff;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.3s ease;
      animation: pulseSoft 2s infinite !important;
    }

    @keyframes pulseSoft {
      0% {
        box-shadow: 0 0 0 0 rgba(30, 58, 138, 0.4);
      }
      70% {
        box-shadow: 0 0 0 8px rgba(30, 58, 138, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(30, 58, 138, 0);
      }
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- 🔹 เปลี่ยนลิงก์โลโก้ -->
    <img src="https://lh5.googleusercontent.com/d/1mBCnF7JoixsDjCDHwlIa2Sde646D6oi8" alt="โลโก้หน่วยงาน" class="logo">

    <h1>ระบบจองเยี่ยมญาติใกล้ชิด</h1>

    <p>
      สำหรับญาติที่ต้องการจองเยี่ยมญาติใกล้ชิด<br>
      กรุณาเข้าสู่ระบบ
    </p>

    <!-- 🔹 ใส่ URL Web App ของคุณตรงนี้ -->
    <a href="https://script.google.com/macros/s/AKfycbzxXbTyxrDxl-ogBY3dOW_pGr5dvhe0uGMUh3G9e3Yd2U--DsQoSEJEJKtRG6Vh4c9U/exec" 
       class="btn" target="_blank">
      เข้าสู่ระบบ
    </a>

    <div class="footer">
      เรือนจำจังหวัดแม่ฮ่องสอน<br>
      กรมราชทัณฑ์<br>
      กระทรวงยุติธรรม
    </div>

  </div>

</body>
</html>
